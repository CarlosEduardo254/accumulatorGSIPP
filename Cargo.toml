[package]
name = "accumulator"
version = "0.2.1"
edition = "2018"
authors = [
  "Pablo Aldape <pablo.aldape@gmail.com>",
  "Lucas Ege <egelucas@gmail.com>",
  "Alan Flores-Lopez <alanf94@gmail.com>",
  "Sanjay Kannan <whaatt@gmail.com>",
  "Michael Straka <mstraka100@gmail.com>",
  "Eddie Wang <eddiew@cs.stanford.edu>"
]
description = "Cryptographic accumulators in Rust."
keywords = ["cryptography", "crypto", "accumulator", "rsa", "vector", "commitment"]
readme = "README.md"
repository = "https://github.com/cambrian/accumulator"

[dependencies]
arrayref = "0.3.5"
blake2-rfc = "0.2.18"
curve25519-dalek = "1.1.3"
# Só a GMP (Integer) é usada: MPFR/MPC desativadas e a suíte `make check` da GMP
# pulada (c-no-tests) — o build da biblioteca C fica bem mais rápido e o binário menor.
gmp-mpfr-sys = { version = "1.5.0", default-features = false, features = ["force-cross", "c-no-tests"] }
lazy_static = "1.3.0"
rug = { version = "1.19.0", default-features = false, features = ["integer", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_bytes = "0.11"
anyhow = "1.0"
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.30"
ctrlc = "3.4"

[features]
# Opcional: liga contra uma GMP já instalada no sistema (ex.: MSYS2 ucrt64, ou
# libgmp-dev:arm64 no WSL) em vez de compilá-la a partir do código C.
#   cargo build --release --features system-gmp
system-gmp = ["gmp-mpfr-sys/use-system-libs"]

[dev-dependencies]
criterion = "0.2.11"
rand = "0.6.5"

[[bin]]
name = "interface_cbor"
path = "interfaceCBOR/test.rs"

[[bin]]
name = "udp_controller"
path = "interfaceCBOR/main.rs"

# Experimento de dinamicidade (adição/revogação/atualização de witness)
[[bin]]
name = "dynamic_bench"
path = "src/bin/dynamic_bench.rs"

[[bin]]
name = "dynamic_tmc"
path = "src/bin/dynamic_tmc.rs"

[[bin]]
name = "dynamic_e2e"
path = "src/bin/dynamic_e2e.rs"

[[bench]]
name = "comparison"
path = "benches/group/rsa.rs"
harness = false

[[bench]]
name = "class"
path = "benches/group/class.rs"
harness = false

[[bench]]
name = "add"
path = "benches/accumulator/add.rs"
harness = false

[[bench]]
name = "delete"
path = "benches/accumulator/delete.rs"
harness = false

[[bench]]
name = "hashes"
path = "benches/hash/hashes.rs"
harness = false

[[bench]]
name = "primality"
path = "benches/hash/primality.rs"
harness = false

[[bench]]
name = "poe"
path = "benches/proof/poe.rs"
harness = false

[[bench]]
name = "pokcr"
path = "benches/proof/pokcr.rs"
harness = false

[[bench]]
name = "poke2"
path = "benches/proof/poke2.rs"
harness = false

[[bench]]
name = "uint"
path = "benches/uint.rs"
harness = false

[profile.bench]
opt-level = 3
debug = true

# Flamegraph debug symbols.
[profile.release]
debug = true
