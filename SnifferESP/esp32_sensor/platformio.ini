; PlatformIO Project Configuration File — ESP32 Sensor (TCC GSIPP)
;
; O firmware (esp32_sensor.ino) usa apenas bibliotecas nativas do ESP32
; Arduino Core (WiFi, WiFiUdp, mbedTLS, time.h); o CBOR é serializado
; manualmente e a MembershipProof fica embutida na flash como array C.
;
; Uso (nesta pasta):
;   0. cp wifi_config.example.h wifi_config.h   (preencha SSID/senha/IP)
;   1. Build:          pio run
;   2. Upload:         pio run --target upload
;   3. Monitor serial: pio device monitor

[platformio]
; O .ino fica na própria pasta (sem precisar movê-lo para src/)
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Compila só o sketch/headers desta pasta (ignora a pasta de build .pio/)
build_src_filter = +<*> -<.pio/> -<.git/>

; Velocidade de upload e monitor serial
upload_speed = 921600
monitor_speed = 115200

; Flags de compilação (opcional - para debug)
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; Monitores múltiplos (opcional)
monitor_filters =
    ; Remove caracteres de controle
    default
    ; Timestamp nos logs
    time
    ; Colorir output
    colorize
